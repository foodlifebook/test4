plugins { id 'com.android.application' }

android {
    namespace 'com.mirrortwins.game'
    compileSdk 35

    signingConfigs {
        mirrorTwinsTest {
            storeFile file('../signing/mirrortwins-test.keystore')
            storePassword 'MirrorTwinsTest2026'
            keyAlias 'mirrortwins-test'
            keyPassword 'MirrorTwinsTest2026'
        }
    }

    defaultConfig {
        applicationId 'com.mirrortwins.game'
        minSdk 24
        targetSdk 35
        versionCode 32
        versionName '2.2.0-mic-permission-fix'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.mirrorTwinsTest
        }
    }
}
