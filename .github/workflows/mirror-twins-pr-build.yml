name: Mirror Twins Local Android APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'mirror-twins-local/**'
      - '.github/workflows/mirror-twins-pr-build.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore local game and generate bundled assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror-twins-local/app/src/main/assets/www

          cat mirror-twins-local/web/index.part*.b64 > /tmp/index.b64
          cat mirror-twins-local/web/styles.part*.b64 > /tmp/styles.b64
          cat mirror-twins-local/web/game.part*.b64 > /tmp/game.b64

          base64 -d /tmp/index.b64 > mirror-twins-local/app/src/main/assets/www/index.html
          base64 -d /tmp/styles.b64 > mirror-twins-local/app/src/main/assets/www/styles.css
          base64 -d /tmp/game.b64 > mirror-twins-local/app/src/main/assets/www/game.js

          python3 mirror-twins-local/generate_assets.py

          test -s mirror-twins-local/app/src/main/assets/www/index.html
          test -s mirror-twins-local/app/src/main/assets/www/styles.css
          test -s mirror-twins-local/app/src/main/assets/www/game.js
          test -s mirror-twins-local/app/src/main/assets/www/assets/splash.png
          test -s mirror-twins-local/app/src/main/assets/www/assets/world_garden.png
          test -s mirror-twins-local/app/src/main/assets/www/assets/audio/music.wav

          node --check mirror-twins-local/app/src/main/assets/www/game.js
          echo "Bundled game assets:"
          du -sh mirror-twins-local/app/src/main/assets
          find mirror-twins-local/app/src/main/assets/www/assets -type f -maxdepth 2 -printf '%p %k KB\n' | sort

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build local debug APK
        run: cd mirror-twins-local && gradle assembleDebug --stacktrace

      - name: Validate and rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="mirror-twins-local/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" MirrorTwins-Solo-1.0.0-local-debug.apk
          ls -lh MirrorTwins-Solo-1.0.0-local-debug.apk
          sha256sum MirrorTwins-Solo-1.0.0-local-debug.apk
          unzip -l MirrorTwins-Solo-1.0.0-local-debug.apk | grep -E 'assets/www/(index.html|game.js|styles.css|assets/splash.png|assets/audio/music.wav)'

      - uses: actions/upload-artifact@v4
        with:
          name: MirrorTwins-Solo-1.0.0-local
          path: MirrorTwins-Solo-1.0.0-local-debug.apk
          if-no-files-found: error
          retention-days: 30
