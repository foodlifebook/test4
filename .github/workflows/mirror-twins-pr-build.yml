name: Mirror Twins PR Android APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'mirror-twins/**'
      - '.github/workflows/mirror-twins-pr-build.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore Android project
        shell: bash
        run: |
          cat mirror-twins/archive.part1 mirror-twins/archive.part2 mirror-twins/archive.part3 mirror-twins/archive.part4 > /tmp/mirror-twins.b64
          base64 -d /tmp/mirror-twins.b64 > /tmp/mirror-twins.zip
          unzip -t /tmp/mirror-twins.zip
          unzip -q /tmp/mirror-twins.zip -d mirror-twins
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: cd mirror-twins/mt_slim && gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp mirror-twins/mt_slim/app/build/outputs/apk/debug/app-debug.apk MirrorTwins-0.5.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorTwins-Android-0.5.0
          path: MirrorTwins-0.5.0-debug.apk
          if-no-files-found: error
          retention-days: 30
