name: Mirror Twins PR Android APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'mirror-twins/**'
      - '.github/workflows/mirror-twins-pr-build.yml'
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore and harden Android project
        shell: bash
        run: |
          cat mirror-twins/archive.part1 mirror-twins/archive.part2 mirror-twins/archive.part3 mirror-twins/archive.part4 > /tmp/mirror-twins.b64
          base64 -d /tmp/mirror-twins.b64 > /tmp/mirror-twins.zip
          unzip -t /tmp/mirror-twins.zip
          unzip -q /tmp/mirror-twins.zip -d mirror-twins
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('mirror-twins/mt_slim/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          s=s.replace('android:label="Mirror Twins"\n        <activity', 'android:label="Mirror Twins">\n        <activity')
          manifest.write_text(s)
          gradle=Path('mirror-twins/mt_slim/app/build.gradle')
          g=gradle.read_text().replace("versionCode 5", "versionCode 6").replace("versionName '0.5.0'", "versionName '0.5.1'")
          gradle.write_text(g)
          PY
          cat > mirror-twins/mt_slim/app/src/main/java/com/mirrortwins/game/MainActivity.java <<'JAVA'
          package com.mirrortwins.game;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      webView = new WebView(this);
                      setContentView(webView);
                      WebSettings s = webView.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setDatabaseEnabled(true);
                      s.setAllowFileAccess(true);
                      s.setAllowContentAccess(true);
                      s.setAllowFileAccessFromFileURLs(true);
                      s.setAllowUniversalAccessFromFileURLs(true);
                      s.setMediaPlaybackRequiresUserGesture(false);
                      webView.setWebViewClient(new WebViewClient());
                      webView.setWebChromeClient(new WebChromeClient());
                      webView.loadUrl("file:///android_asset/www/solo.html");
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  } catch (Throwable t) {
                      android.widget.TextView error = new android.widget.TextView(this);
                      error.setPadding(32, 32, 32, 32);
                      error.setText("Mirror Twins could not start its local game view.\n\n" + t.getClass().getSimpleName() + ": " + String.valueOf(t.getMessage()));
                      setContentView(error);
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          JAVA
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: cd mirror-twins/mt_slim && gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp mirror-twins/mt_slim/app/build/outputs/apk/debug/app-debug.apk MirrorTwins-0.5.1-offline-first-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorTwins-Android-0.5.1-offline-first
          path: MirrorTwins-0.5.1-offline-first-debug.apk
          if-no-files-found: error
          retention-days: 30
