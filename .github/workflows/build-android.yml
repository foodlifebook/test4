name: Build KING LIVE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project shell
        run: flutter create --platforms=android --org com.kinglive.app .

      - name: Prepare full 43-screen entrypoint
        shell: bash
        run: |
          cp lib/release_main.dart lib/main.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main.dart')
          lines=p.read_text().splitlines()
          replacements={
            'class CardX extends StatelessWidget': "class CardX extends StatelessWidget{const CardX({super.key,required this.child,this.tap,this.gold=false,this.pad=const EdgeInsets.all(13)});final Widget child;final VoidCallback? tap;final bool gold;final EdgeInsets pad;@override Widget build(BuildContext c){final alpha=gold ? 0.75 : 0.35;final glow=gold ? 0.13 : 0.04;return Container(decoration:BoxDecoration(color:const Color(0xef0f0f12),borderRadius:BorderRadius.circular(17),border:Border.all(color:(gold?P.bright:P.gold).withOpacity(alpha)),boxShadow:[BoxShadow(color:P.gold.withOpacity(glow),blurRadius:18)]),child:Material(color:Colors.transparent,child:InkWell(onTap:tap,borderRadius:BorderRadius.circular(17),child:Padding(padding:pad,child:child))));}}",
            'class Splash extends StatefulWidget': "class Splash extends StatefulWidget{const Splash({super.key});@override State<Splash> createState()=>_SplashState();} class _SplashState extends State<Splash>{Timer? t;@override void initState(){super.initState();t=Timer(const Duration(milliseconds:1100),(){if(mounted)rep(context,const Core(2));});}@override void dispose(){t?.cancel();super.dispose();}@override Widget build(BuildContext c){return Scaffold(body:Bg(dark:.62,child:SafeArea(child:Center(child:Column(mainAxisSize:MainAxisSize.min,children:[Container(width:125,height:125,decoration:BoxDecoration(shape:BoxShape.circle,color:Colors.black.withOpacity(.75),border:Border.all(color:P.bright,width:2)),child:const Icon(Icons.workspace_premium,color:P.bright,size:70)),const SizedBox(height:22),const Text('KING LIVE',style:TextStyle(color:P.bright,fontSize:36,fontWeight:FontWeight.w900,letterSpacing:2)),const Text('Enter the Royal Room',style:TextStyle(color:P.muted)),const SizedBox(height:28),const SizedBox(width:80,child:LinearProgressIndicator(color:P.bright,backgroundColor:Color(0x443f331b)))])))));}}",
            'Widget live(c,bool host)': "Widget live(c,bool host)=>Scaffold(body:Bg(dark:.56,child:SafeArea(child:Column(children:[Padding(padding:const EdgeInsets.all(12),child:Row(children:[if(!host)...[Pic(hs[0],size:34),const SizedBox(width:7),const Text('Host_01',style:TextStyle(fontWeight:FontWeight.w800)),const SizedBox(width:8),FilledButton(onPressed:()=>msg(c,'Following host'),child:const Text('+ Follow'))],if(host)_dark('👁 3.4k'),const Spacer(),if(host)FilledButton(style:FilledButton.styleFrom(backgroundColor:P.rose),onPressed:()=>Navigator.pop(c),child:const Text('End Live'))else _dark('👁 3.4k')])),if(host)Container(width:double.infinity,color:P.orange,padding:const EdgeInsets.symmetric(vertical:8),child:const Text('⚠ Host not visible — return within 30s',textAlign:TextAlign.center,style:TextStyle(fontWeight:FontWeight.w900,fontSize:11))),Expanded(child:Center(child:Column(mainAxisSize:MainAxisSize.min,children:[Pic(hs[0],size:host?120:105),const SizedBox(height:8),Text(host?'King Host':'Ayesha Queen',style:const TextStyle(fontSize:23,fontWeight:FontWeight.w900)),Text(host?'LIVE CAMERA PREVIEW':'LIVE STREAM',style:const TextStyle(color:P.muted,fontSize:10))]))),Padding(padding:const EdgeInsets.symmetric(horizontal:14,vertical:7),child:Column(children:[Text(host?'viewer22: 🔥🔥🔥':'sara_k: hiii 👋',style:const TextStyle(fontSize:11)),Text(host?'aliZ: welcome back!':'🎁 Ali sent a Sports Car!',style:TextStyle(fontSize:11,color:host?P.ivory:P.bright))])),Padding(padding:const EdgeInsets.fromLTRB(12,6,12,14),child:Row(mainAxisAlignment:MainAxisAlignment.spaceAround,children:[if(host)...[liveIcon(Icons.mic_none,()=>msg(c,'Mic toggled')),liveIcon(Icons.camera_alt_outlined,()=>msg(c,'Camera toggled')),liveIcon(Icons.auto_awesome,()=>msg(c,'Beauty filters')),liveIcon(Icons.sports_kabaddi_outlined,()=>id(c,12))],if(!host)...[liveIcon(Icons.chat_bubble_outline,()=>msg(c,'Comment composer')),liveIcon(Icons.card_giftcard,()=>id(c,11)),liveIcon(Icons.share_outlined,()=>msg(c,'Share link copied'))]]))]))));",
            'Widget country(c)': "Widget country(c)=>Page(title:'Country Ranking',child:Column(children:[const SizedBox(height:8),const CardX(gold:true,child:Row(children:[Text('🇵🇰',style:TextStyle(fontSize:24)),SizedBox(width:8),Expanded(child:Text('Pakistan',style:TextStyle(fontWeight:FontWeight.w900,fontSize:18))),Icon(Icons.arrow_drop_down,color:P.bright)])),const SizedBox(height:8),const Row(children:[ChipX('Top Sender',on:true),SizedBox(width:6),ChipX('Top Host')]),const SizedBox(height:10),Expanded(child:ListView.builder(itemCount:6,itemBuilder:(_,i)=>rowCard('#${i+1}  PK_User_${i+1}','',end:'${45-i*5}k',gold:i<3)))]));",
            'Widget rewards(c)': "Widget rewards(c)=>Page(title:'Weekly Rank Rewards',scroll:true,child:Column(children:[const SizedBox(height:12),const Text('⏱ Resets in 2d 06h 14m',style:TextStyle(color:P.bright,fontWeight:FontWeight.w900)),const SizedBox(height:12),rowCard('🥇 Top 1','Golden King Frame + Dragon Entry + 5,000 coins',gold:true),rowCard('🥈 Top 2','Silver Frame + Lion Entry + 2,500 coins'),rowCard('🥉 Top 3','Bronze Frame + Car Entry + 1,000 coins')]));",
            'Widget agency(c)': "Widget agency(c)=>Page(title:'Agency Dashboard',scroll:true,child:Column(children:[const SizedBox(height:10),const CardX(gold:true,child:Row(children:[Icon(Icons.apartment,color:P.bright,size:35),SizedBox(width:9),Expanded(child:Text('Grafixers Agency',style:TextStyle(fontSize:20,fontWeight:FontWeight.w900)))])),const SizedBox(height:9),Row(children:[Expanded(child:CardX(child:Center(child:Text('62h\\nLive hours',textAlign:TextAlign.center,style:const TextStyle(fontWeight:FontWeight.w900))))),const SizedBox(width:7),Expanded(child:CardX(child:Center(child:Text('18\\nLive days',textAlign:TextAlign.center,style:const TextStyle(fontWeight:FontWeight.w900)))))]),const SizedBox(height:14),_agencyProg('Coins/Beans vs. Target',.68,'68,000 / 100,000 target'),const SizedBox(height:14),_agencyProg('Salary Progress',.45,'Rs 45,000 / Rs 100,000 this month'),const SizedBox(height:14),rowCard('Explore Agency List','Choose or apply to another agency',tap:()=>go(c,const AgencyDirectory()))]));",
            'class ThemePage extends StatefulWidget': "class ThemePage extends StatelessWidget{const ThemePage({super.key});@override Widget build(BuildContext c)=>Page(title:'Theme',scroll:true,child:Column(children:[const SizedBox(height:10),const CardX(gold:true,child:Row(children:[Icon(Icons.workspace_premium,color:P.bright,size:36),SizedBox(width:10),Expanded(child:Column(crossAxisAlignment:CrossAxisAlignment.start,children:[Text('Royal Palace',style:TextStyle(fontWeight:FontWeight.w900)),Text('Gold • Crimson • Emerald',style:TextStyle(color:P.muted,fontSize:10))])),Icon(Icons.check_circle,color:P.bright)])),const SizedBox(height:8),const CardX(child:Row(children:[Icon(Icons.dark_mode_outlined,color:P.gold),SizedBox(width:10),Expanded(child:Text('Obsidian Gold',style:TextStyle(fontWeight:FontWeight.w900)))])),const SizedBox(height:8),const CardX(child:Row(children:[Icon(Icons.local_fire_department_outlined,color:P.red),SizedBox(width:10),Expanded(child:Text('Crimson Crown',style:TextStyle(fontWeight:FontWeight.w900)))]))]));}",
          }
          out=[]
          for line in lines:
            replaced=False
            for prefix,newline in replacements.items():
              if line.startswith(prefix):
                out.append(newline)
                replaced=True
                break
            if not replaced:
              out.append(line.replace('const Pic(hs[','Pic(hs['))
          p.write_text('\n'.join(out)+'\n')
          PY
          rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze source and capture diagnostics
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart > analyze.log 2>&1 || true

      - name: Build installable debug APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug --target lib/main.dart 2>&1 | tee build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KING-LIVE-build-diagnostics
          path: |
            analyze.log
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk KING-LIVE-43-SCREENS-S9.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KING-LIVE-43-SCREENS-S9-APK
          path: KING-LIVE-43-SCREENS-S9.apk
          if-no-files-found: error
          retention-days: 30
