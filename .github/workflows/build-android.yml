name: Build KING LIVE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project shell
        run: flutter create --platforms=android --org com.kinglive.app .

      - name: Use full 43-screen entrypoint
        run: |
          sed 's/body: const Bg(/body: Bg(/' lib/release_main.dart > lib/main.dart
          rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze source and capture diagnostics
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart > analyze.log 2>&1 || true

      - name: Build installable debug APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug --target lib/main.dart 2>&1 | tee build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KING-LIVE-build-diagnostics
          path: |
            analyze.log
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk KING-LIVE-43-SCREENS-S9.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KING-LIVE-43-SCREENS-S9-APK
          path: KING-LIVE-43-SCREENS-S9.apk
          if-no-files-found: error
          retention-days: 30
