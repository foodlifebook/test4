name: Build KING LIVE Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android project shell
        run: flutter create --platforms=android --org com.kinglive.app .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk KING-LIVE-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KING-LIVE-Android-APK
          path: KING-LIVE-test.apk
          if-no-files-found: error
          retention-days: 30
