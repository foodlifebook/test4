name: Mirror Twins Android APK
on:
  push:
    branches: [mirror-twins-apk-build]
    paths:
      - 'mirror-twins/**'
      - '.github/workflows/mirror-twins-android.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror-twins-apk-build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore Android project
        run: |
          base64 -d mirror-twins/android-project.zip.b64 > /tmp/android-project.zip
          unzip -q /tmp/android-project.zip -d mirror-twins
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: cd mirror-twins/android && gradle assembleDebug
      - name: Rename APK
        run: cp mirror-twins/android/app/build/outputs/apk/debug/app-debug.apk MirrorTwins-0.5.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorTwins-Android-0.5.0
          path: MirrorTwins-0.5.0-debug.apk
          if-no-files-found: error
